# Release workflow: runs on every tag push like v0.2.0 and publishes the installers as a GitHub release.
#
# Jobs:
#   check-version  the tag must match the version in app/package.json
#   build          build.yml: backend for all targets and the installers of every platform
#   release        collects the installers, writes SHA256SUMS.txt and creates or updates the GitHub release
#
# The release carries latest.json (app/scripts/make-manifest.mjs): that is what the launcher's updater reads
# (https://github.com/ezTxmMC/volt-launcher/releases/latest/download/latest.json).
# Launchers older than 0.1.2 still read the CDN: publish 0.1.2 there once with app/scripts/publish-cdn.mjs.

name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with app/package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./app/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/package.json version $PKG. Bump the version first." >&2
            exit 1
          fi
          echo "Releasing $PKG"

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Write the manifest and the checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node app/scripts/make-manifest.mjs --dir assets --version "$VERSION" --out assets/latest.json
          (cd assets && sha256sum $(ls | grep -v '^latest.json$') > SHA256SUMS.txt)
          cat assets/SHA256SUMS.txt

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --verify-tag --title "Volt Launcher $GITHUB_REF_NAME" --generate-notes "${PRERELEASE[@]}"
          fi
